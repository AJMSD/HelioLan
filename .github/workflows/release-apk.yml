name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        if: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/heliolan-release.jks"
          echo "HELIOLAN_RELEASE_STORE_FILE=$RUNNER_TEMP/heliolan-release.jks" >> "$GITHUB_ENV"
          echo "HELIOLAN_RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "HELIOLAN_RELEASE_KEY_ALIAS=${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "HELIOLAN_RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Generate SHA256 checksums
        run: sha256sum app/build/outputs/apk/release/*.apk > app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: heliolan-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/outputs/mapping/release/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          generate_release_notes: true
          append_body: true
          body_path: RELEASE_NOTES_TEMPLATE.md
