name: Device Matrix

on:
  workflow_dispatch:

jobs:
  android-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 30
            system-image: google_apis
            arch: x86_64
            profile: pixel_4
          - api-level: 33
            system-image: google_apis
            arch: x86_64
            profile: pixel_5
          - api-level: 35
            system-image: google_apis
            arch: x86_64
            profile: pixel_8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build app + androidTest APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.system-image }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
